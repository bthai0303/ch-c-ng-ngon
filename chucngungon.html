<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chúc Ngủ Ngon 🌙</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0a0e1a;
        --midnight: #0f1630;
        --indigo: #1a2050;
        --gold: #c9a84c;
        --gold-dim: #7a6030;
        --lavender: #b8a9d4;
        --silver: #d0cee8;
        --white: #f0eeff;
        --moon: #fff8dc;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--navy);
        font-family: "Cormorant Garamond", Georgia, serif;
        color: var(--white);
      }

      /* ══════════════════════════════
       INTRO SCREEN
    ══════════════════════════════ */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          ellipse 140% 100% at 50% 120%,
          #1a2050 0%,
          #0f1630 45%,
          #060810 100%
        );
        transition:
          opacity 0.9s ease,
          transform 0.9s ease;
      }
      #intro.hide {
        opacity: 0;
        transform: scale(1.06);
        pointer-events: none;
      }

      .intro-moon {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 35%,
          #fff8e1 0%,
          #fdeea0 40%,
          #c9a84c 100%
        );
        box-shadow:
          0 0 40px 16px rgba(255, 240, 150, 0.3),
          0 0 100px 40px rgba(201, 168, 76, 0.15),
          inset -10px -8px 22px rgba(120, 90, 20, 0.3);
        margin-bottom: 2.4rem;
        animation: introPulse 3s ease-in-out infinite alternate;
      }
      @keyframes introPulse {
        from {
          box-shadow:
            0 0 40px 16px rgba(255, 240, 150, 0.3),
            0 0 100px 40px rgba(201, 168, 76, 0.15),
            inset -10px -8px 22px rgba(120, 90, 20, 0.3);
        }
        to {
          box-shadow:
            0 0 60px 24px rgba(255, 240, 150, 0.45),
            0 0 150px 60px rgba(201, 168, 76, 0.22),
            inset -10px -8px 22px rgba(120, 90, 20, 0.3);
        }
      }
      .intro-moon::before,
      .intro-moon::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(160, 120, 30, 0.22);
      }
      .intro-moon::before {
        width: 22px;
        height: 22px;
        top: 24px;
        left: 32px;
      }
      .intro-moon::after {
        width: 14px;
        height: 14px;
        top: 56px;
        left: 20px;
      }

      .intro-label {
        font-family: "Cinzel", serif;
        font-size: 0.7rem;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--gold-dim);
        margin-bottom: 1rem;
        animation: fadeUp 0.8s 0.3s both;
      }

      .intro-title {
        font-size: clamp(1.6rem, 5vw, 2.4rem);
        font-weight: 300;
        color: var(--silver);
        text-align: center;
        line-height: 1.5;
        margin-bottom: 3rem;
        animation: fadeUp 0.9s 0.5s both;
      }
      .intro-title strong {
        font-weight: 400;
        color: var(--white);
      }

      /* ── Button ── */
      .btn {
        position: relative;
        font-family: "Cinzel", serif;
        font-size: 0.8rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--navy);
        background: linear-gradient(
          135deg,
          #e8c96a 0%,
          #c9a84c 50%,
          #a8852e 100%
        );
        border: none;
        border-radius: 50px;
        padding: 0.95rem 2.8rem;
        cursor: pointer;
        overflow: hidden;
        animation: fadeUp 0.8s 0.8s both;
        box-shadow:
          0 4px 20px rgba(201, 168, 76, 0.4),
          0 1px 0 rgba(255, 255, 255, 0.2) inset;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px) scale(1.03);
        box-shadow:
          0 8px 32px rgba(201, 168, 76, 0.55),
          0 1px 0 rgba(255, 255, 255, 0.2) inset;
      }
      .btn:active {
        transform: scale(0.97);
      }

      /* ripple */
      .btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.35) 0%,
          transparent 70%
        );
        opacity: 0;
        transition: opacity 0.4s;
      }
      .btn:hover::after {
        opacity: 1;
      }

      .btn-icon {
        margin-right: 0.5rem;
        font-size: 1rem;
      }

      /* stars on intro bg */
      #intro-stars {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* ══════════════════════════════
       MAIN SCREEN (hidden initially)
    ══════════════════════════════ */
      #main {
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s 0.3s ease;
      }
      #main.show {
        opacity: 1;
        pointer-events: auto;
      }

      /* ── Sky canvas ── */
      .sky {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse 120% 80% at 50% 110%,
          #1a2050 0%,
          #0f1630 40%,
          #0a0e1a 100%
        );
      }

      /* ── Aurora ── */
      .aurora {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .aurora::before,
      .aurora::after {
        content: "";
        position: absolute;
        width: 200%;
        height: 60%;
        top: 5%;
        left: -50%;
        border-radius: 50%;
        opacity: 0.07;
        animation: drift 14s ease-in-out infinite alternate;
      }
      .aurora::before {
        background: conic-gradient(
          from 200deg,
          #4f6ef7,
          #9b59b6,
          #2ecc71,
          #4f6ef7
        );
        filter: blur(60px);
      }
      .aurora::after {
        top: 15%;
        background: conic-gradient(
          from 30deg,
          #9b59b6,
          #4f6ef7,
          #1abc9c,
          #9b59b6
        );
        filter: blur(80px);
        animation-delay: -7s;
        animation-duration: 18s;
      }
      @keyframes drift {
        from {
          transform: translateX(-8%) scaleY(1);
        }
        to {
          transform: translateX(8%) scaleY(1.15);
        }
      }

      /* ── Stars ── */
      .stars {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: var(--silver);
        animation: twinkle var(--dur, 3s) ease-in-out infinite;
        animation-delay: var(--del, 0s);
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: var(--lo, 0.2);
          transform: scale(1);
        }
        50% {
          opacity: var(--hi, 1);
          transform: scale(1.4);
        }
      }

      /* ── Moon ── */
      .moon-wrap {
        position: absolute;
        top: 8%;
        right: 12%;
        animation: moonrise 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        opacity: 0;
      }
      @keyframes moonrise {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .moon {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 35%,
          #fff8e1 0%,
          #fdeea0 40%,
          #c9a84c 100%
        );
        box-shadow:
          0 0 30px 12px rgba(255, 240, 150, 0.25),
          0 0 80px 30px rgba(201, 168, 76, 0.12),
          inset -8px -6px 18px rgba(120, 90, 20, 0.3);
        animation: moonGlow 4s ease-in-out infinite alternate;
      }
      @keyframes moonGlow {
        from {
          box-shadow:
            0 0 30px 12px rgba(255, 240, 150, 0.25),
            0 0 80px 30px rgba(201, 168, 76, 0.12),
            inset -8px -6px 18px rgba(120, 90, 20, 0.3);
        }
        to {
          box-shadow:
            0 0 50px 20px rgba(255, 240, 150, 0.35),
            0 0 120px 50px rgba(201, 168, 76, 0.18),
            inset -8px -6px 18px rgba(120, 90, 20, 0.3);
        }
      }
      .moon::before,
      .moon::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(160, 120, 30, 0.25);
      }
      .moon::before {
        width: 20px;
        height: 20px;
        top: 22px;
        left: 28px;
      }
      .moon::after {
        width: 12px;
        height: 12px;
        top: 48px;
        left: 16px;
      }

      /* ── Clouds ── */
      .cloud {
        position: absolute;
        border-radius: 50px;
        background: rgba(184, 169, 212, 0.07);
        filter: blur(14px);
        animation: float var(--spd, 40s) linear infinite;
      }
      @keyframes float {
        from {
          transform: translateX(-20vw);
        }
        to {
          transform: translateX(120vw);
        }
      }

      /* ── Hills ── */
      .hills {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 30vh;
        pointer-events: none;
      }
      .hills svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ── Card ── */
      .card {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }
      .card-inner {
        position: relative;
        max-width: 520px;
        background: rgba(15, 22, 48, 0.55);
        border: 1px solid rgba(201, 168, 76, 0.18);
        border-radius: 24px;
        padding: 3.5rem 3rem;
        backdrop-filter: blur(18px);
        box-shadow:
          0 8px 48px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: cardFade 1.8s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes cardFade {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .eyebrow {
        font-family: "Cinzel", serif;
        font-size: 0.7rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 1.6rem;
        opacity: 0;
        animation: fadeUp 0.8s 0.5s forwards;
      }
      .main-title {
        font-family: "Cormorant Garamond", serif;
        font-weight: 300;
        font-size: clamp(2.8rem, 7vw, 4.2rem);
        line-height: 1.1;
        color: var(--white);
        margin-bottom: 0.5rem;
        opacity: 0;
        animation: fadeUp 0.9s 0.7s forwards;
      }
      .main-title em {
        font-style: italic;
        color: var(--gold);
      }
      .emoji-row {
        font-size: 2rem;
        margin-bottom: 0.4rem;
        opacity: 0;
        animation: fadeUp 0.8s 0.9s forwards;
      }
      .sub-title {
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        font-weight: 300;
        letter-spacing: 0.08em;
        color: var(--lavender);
        margin-bottom: 2.4rem;
        opacity: 0;
        animation: fadeUp 0.8s 1s forwards;
      }
      .divider {
        width: 60px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
        margin: 0 auto 2.2rem;
        opacity: 0;
        animation: fadeUp 0.8s 1.1s forwards;
      }
      .footer-note {
        margin-top: 2.6rem;
        font-family: "Cinzel", serif;
        font-size: 0.65rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--gold-dim);
        opacity: 0;
        animation: fadeUp 0.8s 1.3s forwards;
      }

      /* ZZZ */
      .zzz-wrap {
        position: absolute;
        bottom: calc(100% + 1rem);
        right: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        pointer-events: none;
      }
      .z {
        font-family: "Cinzel", serif;
        color: var(--gold);
        opacity: 0;
        animation: floatZ 3.6s ease-in-out infinite;
      }
      .z:nth-child(1) {
        font-size: 0.9rem;
        animation-delay: 0s;
      }
      .z:nth-child(2) {
        font-size: 1.2rem;
        animation-delay: 0.6s;
      }
      .z:nth-child(3) {
        font-size: 1.6rem;
        animation-delay: 1.2s;
      }
      @keyframes floatZ {
        0% {
          opacity: 0;
          transform: translateY(0) translateX(0);
        }
        30% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;
          transform: translateY(-55px) translateX(14px);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Shooting star */
      .shoot {
        position: absolute;
        top: 18%;
        left: 0;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: white;
        opacity: 0;
        animation: shoot 6s 4s ease-out infinite;
      }
      @keyframes shoot {
        0% {
          opacity: 0;
          transform: translate(10vw, 0) rotate(-30deg) scaleX(1);
        }
        5% {
          opacity: 1;
        }
        25% {
          opacity: 0;
          transform: translate(60vw, 25vh) rotate(-30deg) scaleX(18);
        }
        100% {
          opacity: 0;
          transform: translate(60vw, 25vh) rotate(-30deg) scaleX(18);
        }
      }
    </style>
  </head>
  <body>
    <!-- ══════════ INTRO SCREEN ══════════ -->
    <div id="intro">
      <div id="intro-stars"></div>

      <div class="intro-moon"></div>

      <p class="intro-title"><strong>lời chúc buổi tối</strong> đến bạn 🌙</p>

      <button class="btn" onclick="reveal()">
        <span class="btn-icon">🌙</span> Mở ra nào
      </button>
    </div>

    <!-- ══════════ MAIN SCREEN ══════════ -->
    <div id="main">
      <div class="sky">
        <div class="aurora"></div>
        <div class="stars" id="stars"></div>
        <div class="moon-wrap"><div class="moon"></div></div>
        <div class="shoot"></div>
        <div
          class="cloud"
          style="
            width: 220px;
            height: 55px;
            top: 20%;
            left: -20vw;
            --spd: 55s;
            animation-delay: -12s;
          "
        ></div>
        <div
          class="cloud"
          style="
            width: 160px;
            height: 40px;
            top: 32%;
            left: -20vw;
            --spd: 70s;
            animation-delay: -35s;
          "
        ></div>
        <div
          class="cloud"
          style="
            width: 300px;
            height: 65px;
            top: 14%;
            left: -20vw;
            --spd: 90s;
            animation-delay: -60s;
          "
        ></div>
        <div class="hills">
          <svg
            viewBox="0 0 1440 220"
            preserveAspectRatio="none"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M0 220 Q180 80 360 140 Q540 200 720 100 Q900 10 1080 120 Q1260 220 1440 90 L1440 220 Z"
              fill="#070b14"
            />
            <path
              d="M0 220 Q220 140 440 180 Q660 220 900 160 Q1080 110 1200 170 Q1320 220 1440 155 L1440 220 Z"
              fill="#0a0e1a"
              opacity=".9"
            />
            <g fill="#0d1220">
              <polygon points="360,140 368,168 352,168" />
              <polygon points="372,145 379,168 365,168" />
              <polygon points="700,100 708,125 692,125" />
              <polygon points="712,107 720,130 704,130" />
              <polygon points="1075,120 1083,145 1067,145" />
            </g>
          </svg>
        </div>
      </div>

      <div class="card">
        <div class="card-inner">
          <div class="zzz-wrap">
            <span class="z">z</span>
            <span class="z">z</span>
            <span class="z">Z</span>
          </div>
          <h1 class="main-title">Chúc Cậu<br /><em>Ngủ Ngon</em></h1>
          <p class="emoji-row">😴😴😴</p>
          <p class="sub-title">Sweet dreams &amp; peaceful night</p>
          <div class="divider"></div>
          <p class="footer-note">
            🌙 Ngủ ngon &nbsp;·&nbsp; Mơ đẹp &nbsp;·&nbsp; Bình an
          </p>
        </div>
      </div>
    </div>

    <script>
      // Stars on intro
      function makeStars(containerId, count) {
        const c = document.getElementById(containerId);
        for (let i = 0; i < count; i++) {
          const s = document.createElement("div");
          const size = Math.random() * 2 + 0.4;
          Object.assign(s.style, {
            position: "absolute",
            borderRadius: "50%",
            background: "#d0cee8",
            width: size + "px",
            height: size + "px",
            top: Math.random() * 100 + "%",
            left: Math.random() * 100 + "%",
            opacity: (Math.random() * 0.5 + 0.1).toFixed(2),
            animation: `twinkle ${(Math.random() * 4 + 2).toFixed(1)}s ease-in-out infinite`,
            animationDelay: `-${(Math.random() * 6).toFixed(1)}s`,
            "--lo": (0.05 + Math.random() * 0.15).toFixed(2),
            "--hi": (0.4 + Math.random() * 0.6).toFixed(2),
          });
          c.appendChild(s);
        }
      }
      makeStars("intro-stars", 120);

      // Stars on main
      function makeMainStars() {
        const c = document.getElementById("stars");
        for (let i = 0; i < 160; i++) {
          const s = document.createElement("div");
          s.className = "star";
          const size = Math.random() * 2.4 + 0.5;
          Object.assign(s.style, {
            width: size + "px",
            height: size + "px",
            top: Math.random() * 85 + "%",
            left: Math.random() * 100 + "%",
            "--dur": (Math.random() * 4 + 2).toFixed(1) + "s",
            "--del": "-" + (Math.random() * 6).toFixed(1) + "s",
            "--lo": (Math.random() * 0.15 + 0.05).toFixed(2),
            "--hi": (Math.random() * 0.6 + 0.4).toFixed(2),
          });
          c.appendChild(s);
        }
      }

      function reveal() {
        makeMainStars();
        document.getElementById("intro").classList.add("hide");
        setTimeout(() => {
          document.getElementById("intro").style.display = "none";
          const main = document.getElementById("main");
          main.style.display = "block";
          requestAnimationFrame(() => main.classList.add("show"));
        }, 900);
      }
    </script>
  </body>
</html>
